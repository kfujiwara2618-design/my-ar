<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Camera & Always-On 3D Model</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }

    /* ラグジュアリーなステータス表示（グラスモーフィズム） */
    #info-overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f7f3ed;
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      font-size: 11px;
      letter-spacing: 0.1em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }

    /* 最高級メタリック調のシャッターボタン */
    #shutter-container {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>

  <!-- A-Frame ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

  <!-- ステータス・ガイド表示 -->
  <div id="info-overlay">
    <div>AR CAMERA: <span id="status">ACTIVE (常時表示モード)</span></div>
    <div style="margin-top: 2px; font-size: 8.5px; color: rgba(255,255,255,0.6);">1本指で回転 / 2本指でピンチ拡大縮小 / ボタンで撮影</div>
  </div>

  <!-- シャッターボタン -->
  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <!-- 常にカメラ映像と3Dモデルを表示するシーン -->
  <a-scene 
    embedded
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    renderer="preserveDrawingBuffer: true, colorManagement: true">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <!-- カメラ位置と、スマホの向き（ジャイロ・デバイス方位）に連動する視点制御 -->
    <a-camera position="0 1.6 0" look-controls="enabled: true"></a-camera>

    <!-- マーカーを使わず、カメラの真正面（少し前方の空間）に常時3Dモデルを配置 -->
    <a-entity id="houseMesh" 
      gltf-model="#houseModel" 
      position="0 1.2 -1.5" 
      scale="0.3 0.3 0.3" 
      rotation="0 0 0">
    </a-entity>

    <!-- 背景にスマホのリアルタイムカメラ映像をフルスクリーンで映し出すシステム -->
    <a-entity id="ar-camera-bg" camera></a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const houseMesh = document.querySelector('#houseMesh');
    const shutterBtn = document.getElementById('shutter-btn');
    const sceneEl = document.querySelector('a-scene');

    // --- ブラウザの標準機能で背面カメラ映像を背景に常時ストリーミング起動 ---
    async function startCameraBackground() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        setupVideoElement(stream);
      } catch (err) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          setupVideoElement(stream);
        } catch (e) {
          statusEl.textContent = "カメラエラー";
          console.error(e);
        }
      }
    }

    let bgVideoEl = null;
    function setupVideoElement(stream) {
      bgVideoEl = document.createElement('video');
      bgVideoEl.srcObject = stream;
      bgVideoEl.setAttribute('autoplay', '');
      bgVideoEl.setAttribute('playsinline', '');
      bgVideoEl.setAttribute('muted', '');
      bgVideoEl.style.position = 'absolute';
      bgVideoEl.style.top = '0';
      bgVideoEl.style.left = '0';
      bgVideoEl.style.width = '100vw';
      bgVideoEl.style.height = '100vh';
      bgVideoEl.style.objectFit = 'cover';
      bgVideoEl.style.zIndex = '-1'; // 3DシーンやUIの後ろに配置
      document.body.prepend(bgVideoEl);
      statusEl.textContent = "常時表示中 (撮影可能)";
    }
    startCameraBackground();

    // --- タッチ操作（1本指スワイプ全方向回転 ＆ 2本指ピンチ拡大縮小） ---
    let startX = null;
    let startY = null;
    let currentRotX = 0;
    let currentRotY = 0;
    let initialDistance = null;
    let initialScale = 0.3;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (houseMesh) {
          const s = houseMesh.getAttribute('scale');
          if (s) initialScale = s.x;
        }
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!houseMesh) return;

      if (e.touches.length === 1 && startX !== null && startY !== null) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;
        currentRotY += deltaX * 0.5;
        currentRotX += deltaY * 0.5;
        houseMesh.setAttribute('rotation', `${currentRotX} ${currentRotY} 0`);
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialDistance !== null && initialDistance > 0) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.05, Math.min(2.0, initialScale * factor));
        houseMesh.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      startX = null;
      startY = null;
      initialDistance = null;
    });

    // --- シャッター撮影機能（カメラ映像 ＋ 3Dモデル合成保存） ---
    shutterBtn.addEventListener('click', () => {
      const arCanvas = sceneEl.renderer.domElement;
      const saveCanvas = document.createElement('canvas');
      saveCanvas.width = arCanvas.width;
      saveCanvas.height = arCanvas.height;
      const saveCtx = saveCanvas.getContext('2d');

      // ① 背景のカメラ映像を描画
      if (bgVideoEl && bgVideoEl.readyState === bgVideoEl.HAVE_ENOUGH_DATA) {
        const vRatio = bgVideoEl.videoWidth / bgVideoEl.videoHeight;
        const cRatio = saveCanvas.width / saveCanvas.height;
        let w = saveCanvas.width, h = saveCanvas.height, x = 0, y = 0;
        if (vRatio > cRatio) {
          w = saveCanvas.height * vRatio;
          x = (saveCanvas.width - w) / 2;
        } else {
          h = saveCanvas.width / vRatio;
          y = (saveCanvas.height - h) / 2;
        }
        saveCtx.drawImage(bgVideoEl, x, y, w, h);
      }

      // ② 3Dモデルを描画
      saveCtx.drawImage(arCanvas, 0, 0);

      // ③ 画像としてダウンロード保存
      const link = document.createElement('a');
      link.download = 'ar_always_on_' + Date.now() + '.png';
      link.href = saveCanvas.toDataURL('image/png', 1.0);
      link.click();
    });
  </script>
</body>
</html>
