<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 縦横無尽3D自動回転</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.6;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; font-size: 14px; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #61afef; }
  </style>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- 3Dモデル内部アニメーション再生用 (gltf animation-mixer) -->
  <script src="https://cdn.jsdelivr.net/gh/c3000/aframe-extras@v7.1.0/dist/aframe-extras.min.js"></script>

  <script>
    // =========================================================
    // ★ 全軸（X・Y・Z）独立・縦横無尽自動回転コンポーネント ★
    // =========================================================
    AFRAME.registerComponent('auto-rotate-3d', {
      schema: {
        speedX: { type: 'number', default: 0.3 }, // X軸（縦回転）のスピード
        speedY: { type: 'number', default: 0.6 }, // Y軸（横回転）のスピード
        speedZ: { type: 'number', default: 0.2 }  // Z軸（斜めひねり）のスピード
      },
      tick: function (time, timeDelta) {
        if (!this.el.object3D) return;
        
        // 時間経過（秒）に比例して角度を加算
        const dt = timeDelta / 1000;
        
        this.el.object3D.rotation.x += this.data.speedX * dt;
        this.el.object3D.rotation.y += this.data.speedY * dt;
        this.el.object3D.rotation.z += this.data.speedZ * dt;
      }
    });
  </script>
</head>
<body>

  <div id="info-overlay">
    <div><strong>状態:</strong> <span id="status">カメラ起動準備中...</span></div>
    <div id="details" style="margin-top: 6px;">マーカーをカメラにかざしてください。</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- 
        ★ auto-rotate-3d 属性で各軸の回転速度を指定（数値を変更可能）
        ・speedX: 縦方向の回転速度
        ・speedY: 横方向の回転速度
        ・speedZ: 斜め傾きの回転速度
        ・animation-mixer: .glbモデル自体の組み込みアニメーションも自動再生
      -->
      <a-gltf-model 
        id="houseMesh" 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25"
        auto-rotate-3d="speedX: 0.4; speedY: 0.8; speedZ: 0.3;"
        animation-mixer="clip: *; loop: repeat;">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！";
      statusEl.className = "success";
      detailsEl.innerHTML = "マーカーを映すと、家が縦横無尽に自転します。";
    });

    const targetEntity = document.querySelector('#targetEntity');
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = 'マーカー認識成功！';
      statusEl.className = 'success';
      detailsEl.innerHTML = '全軸3D自動回転中！';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカー検索中...';
      statusEl.className = '';
      detailsEl.innerHTML = 'カメラにマーカー画像をかざしてください。';
    });
  </script>
</body>
</html>
