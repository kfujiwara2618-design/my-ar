<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR 3Dモデル表示</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.6;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; font-size: 14px; color: #ffd700; }
    .error { color: #ff6b6b !important; }
    .success { color: #51cf66 !important; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #61afef; }
  </style>

  <!-- A-Frame & MindAR ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="info-overlay">
    <div><strong>状態:</strong> <span id="status">カメラ起動準備中...</span></div>
    <div id="details" style="margin-top: 6px;">カメラアクセスを許可してください。</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカー認識時のみ表示されるエンティティ -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25" 
        rotation="0 90 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const sceneEl = document.querySelector('a-scene');

    // MindARの読み込み完了イベント
    sceneEl.addEventListener("arReady", (event) => {
      statusEl.textContent = "カメラ起動成功！マーカーをかざしてください";
      statusEl.className = "success";
      detailsEl.innerHTML = "<code>targets.mind</code> の画像をカメラに映すと、家に切り替わります。";
    });

    // MindARのエラーイベント
    sceneEl.addEventListener("arError", (event) => {
      statusEl.textContent = "ARエラーが発生しました";
      statusEl.className = "error";
      detailsEl.innerHTML = "<code>targets.mind</code> が読み込めないか、カメラへのアクセスが拒否されています。";
    });

    // マーカー発見
    const targetEntity = document.querySelector('#targetEntity');
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = 'マーカー認識成功！';
      statusEl.className = 'success';
      detailsEl.innerHTML = '家の3Dモデルを表示中！';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカー検索中...';
      statusEl.className = '';
      detailsEl.innerHTML = 'カメラにマーカー画像をかざしてください。';
    });
  </script>
</body>
</html>
