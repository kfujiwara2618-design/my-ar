<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 自由タッチ操作（縦横回転・拡大縮小）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none; /* スワイプ時の画面スクロールを防止 */
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.6;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; font-size: 14px; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #61afef; }
  </style>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="info-overlay">
    <div><strong>状態:</strong> <span id="status">カメラ起動準備中...</span></div>
    <div id="details" style="margin-top: 6px;">マーカーをカメラにかざしてください。</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <!-- 3Dモデル（自動アニメーションはすべて削除） -->
      <a-gltf-model 
        id="houseMesh" 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const sceneEl = document.querySelector('a-scene');
    const houseMesh = document.querySelector('#houseMesh');

    // AR起動完了イベント
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！";
      statusEl.className = "success";
      detailsEl.innerHTML = "マーカーを映してください。<br>【操作】1本指スワイプ: 縦横回転 / 2本指ピンチ: 拡大縮小";
    });

    // マーカー検知イベント
    const targetEntity = document.querySelector('#targetEntity');
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = 'マーカー認識成功！';
      statusEl.className = 'success';
      detailsEl.innerHTML = 'スワイプで縦横回転、ピンチで拡大縮小できます。';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカー検索中...';
      statusEl.className = '';
      detailsEl.innerHTML = 'カメラにマーカー画像をかざしてください。';
    });

    // =========================================================
    // ★ スマホのタッチ操作（1本指: 縦横無尽回転 / 2本指: 拡大縮小） ★
    // =========================================================
    let startX = 0;
    let startY = 0;
    let initialDistance = null;
    let initialScale = 0.25;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        // 1本指タッチ：タッチ開始座標（X, Y）を記録
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        // 2本指タッチ：ピンチ開始時の2点間距離を計算
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const currentScaleObj = houseMesh.getAttribute('scale');
        initialScale = currentScaleObj.x;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && startX !== null && startY !== null) {
        // 1本指スワイプ：左右でY軸回転（横）、上下でX軸回転（縦）
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;

        if (houseMesh.object3D) {
          // Three.js の回転オイラー角を直接加算（0.008は操作感度の調整値）
          houseMesh.object3D.rotation.y += deltaX * 0.008;
          houseMesh.object3D.rotation.x += deltaY * 0.008;
        }

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialDistance !== null) {
        // 2本指ピンチ：拡大縮小（0.05倍〜1.5倍の範囲制限）
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.05, Math.min(1.5, initialScale * factor));
        houseMesh.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    });

    window.addEventListener('touchend', () => {
      startX = null;
      startY = null;
      initialDistance = null;
    });
  </script>
</body>
</html>
