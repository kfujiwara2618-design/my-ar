<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR タッチ操作（回転・拡大縮小）対応</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.6;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; font-size: 14px; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #61afef; }
  </style>

  <!-- A-Frame & MindAR ライブラリ -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- スマホ・タッチ操作用コンポーネント（回転・スケーリング） -->
  <script>
    AFRAME.registerComponent('gesture-handler', {
      schema: {
        minScale: { default: 0.05 },
        maxScale: { default: 1.2 }
      },
      init: function () {
        this.isVisible = false;
        this.initialTouchDistance = null;
        this.initialScale = { x: 0.25, y: 0.25, z: 0.25 };
        this.touchStartPos = { x: 0, y: 0 };

        // マーカー認識時のみタッチ操作を有効化
        const parentEntity = this.el.parentElement;
        if (parentEntity) {
          parentEntity.addEventListener('targetFound', () => { this.isVisible = true; });
          parentEntity.addEventListener('targetLost', () => { this.isVisible = false; });
        }

        this.handleTouchStart = this.handleTouchStart.bind(this);
        this.handleTouchMove = this.handleTouchMove.bind(this);

        window.addEventListener('touchstart', this.handleTouchStart);
        window.addEventListener('touchmove', this.handleTouchMove);
      },

      handleTouchStart: function (e) {
        if (!this.isVisible) return;

        if (e.touches.length === 1) {
          // 1本指タップ開始位置を記憶
          this.touchStartPos.x = e.touches[0].clientX;
          this.touchStartPos.y = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          // 2本指タップ開始時の指同士の距離を保持
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this.initialTouchDistance = Math.hypot(dx, dy);
          const currentScale = this.el.getAttribute('scale');
          this.initialScale = { ...currentScale };
        }
      },

      handleTouchMove: function (e) {
        if (!this.isVisible) return;

        // ■ 1本指スワイプ操作：3Dモデルの回転
        if (e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - this.touchStartPos.x;
          const deltaY = e.touches[0].clientY - this.touchStartPos.y;

          const rotation = this.el.getAttribute('rotation');
          const newY = rotation.y + deltaX * 0.6; // 左右ドラッグで回転
          const newX = rotation.x + deltaY * 0.4; // 上下ドラッグで角度調整

          this.el.setAttribute('rotation', `${newX} ${newY} ${rotation.z}`);

          this.touchStartPos.x = e.touches[0].clientX;
          this.touchStartPos.y = e.touches[0].clientY;
        } 
        // ■ 2本指ピンチ操作：3Dモデルの拡大・縮小
        else if (e.touches.length === 2 && this.initialTouchDistance) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const currentDistance = Math.hypot(dx, dy);

          const factor = currentDistance / this.initialTouchDistance;
          let newScale = this.initialScale.x * factor;

          // モデルが大きすぎたり見えなくなったりしないよう制限
          newScale = Math.min(Math.max(newScale, this.data.minScale), this.data.maxScale);

          this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
        }
      }
    });
  </script>
</head>
<body>

  <div id="info-overlay">
    <div><strong>状態:</strong> <span id="status">カメラ起動準備中...</span></div>
    <div id="details" style="margin-top: 6px;">マーカー画像をカメラにかざしてください。</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカー 1枚目 (targetIndex: 0) -->
    <a-entity id="targetEntity0" mindar-image-target="targetIndex: 0">
      <!-- gesture-handler を付与してタッチ操作を可能にする -->
      <a-gltf-model 
        gesture-handler 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！";
      statusEl.className = "success";
      detailsEl.innerHTML = "マーカー画像をカメラにかざしてください。";
    });

    document.querySelector('#targetEntity0').addEventListener('targetFound', () => {
      statusEl.textContent = 'マーカー認識成功！';
      statusEl.className = 'success';
      detailsEl.innerHTML = '👉 1本指スワイプで回転<br>👉 2本指ピンチ操作で拡大・縮小';
    });

    document.querySelector('#targetEntity0').addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカー検索中...';
      statusEl.className = '';
      detailsEl.innerHTML = 'カメラにマーカー画像をかざしてください。';
    });
  </script>
</body>
</html>
