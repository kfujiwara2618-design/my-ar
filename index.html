<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR 縦横無尽タッチ操作モデル（認識改善版）</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none; /* スマホ画面のスクロールを無効化 */
    }
    #info-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 8px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.6;
      z-index: 999;
      pointer-events: none;
    }
    #status { font-weight: bold; font-size: 14px; color: #ffd700; }
    .success { color: #51cf66 !important; }
    .error { color: #ff6b6b !important; }
    code { background: #333; padding: 2px 6px; border-radius: 4px; color: #61afef; }
  </style>

  <!-- MindAR 1.2.5 と互換性が最も高い A-Frame 1.4.2 を使用 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="info-overlay">
    <div><strong>状態:</strong> <span id="status">カメラ起動準備中...</span></div>
    <div id="details" style="margin-top: 6px;">マーカーをカメラにかざしてください。</div>
  </div>

  <!-- 認識感度と平滑化（スムージング）のバランスを最適化した設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 10; missTolerance: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="houseModel" src="house.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        id="houseMesh" 
        src="#houseModel" 
        position="0 0 0" 
        scale="0.25 0.25 0.25" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const sceneEl = document.querySelector('a-scene');
    const houseMesh = document.querySelector('#houseMesh');

    // 1. AR起動成功イベント
    sceneEl.addEventListener("arReady", () => {
      statusEl.textContent = "カメラ起動成功！";
      statusEl.className = "success";
      detailsEl.innerHTML = "マーカーを映すと家が表示されます。<br>【操作方法】<br>・1本指スワイプ：上下左右に自由回転<br>・2本指ピンチ：拡大・縮小";
    });

    // 2. AR読み込み・カメラエラーのイベント検出
    sceneEl.addEventListener("arError", (event) => {
      statusEl.textContent = "AR起動エラー";
      statusEl.className = "error";
      detailsEl.innerHTML = "<code>targets.mind</code> の読み込み失敗、またはカメラアクセスが拒否されました。";
    });

    // 3. マーカー認識イベント
    const targetEntity = document.querySelector('#targetEntity');
    targetEntity.addEventListener('targetFound', () => {
      statusEl.textContent = 'マーカー認識成功！';
      statusEl.className = 'success';
      detailsEl.innerHTML = 'スワイプで縦横無尽に回転操作できます。';
    });

    targetEntity.addEventListener('targetLost', () => {
      statusEl.textContent = 'マーカー検索中...';
      statusEl.className = '';
      detailsEl.innerHTML = 'カメラにマーカー画像をかざしてください。';
    });

    // 4. 【縦横無尽回転 ＆ 拡大縮小】タッチイベント処理
    let startX = null;
    let startY = null;
    let currentRotX = 0; // 縦回転（X軸）
    let currentRotY = 0; // 横回転（Y軸）
    let initialDistance = null;
    let initialScale = 0.25;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initialDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const currentScaleObj = houseMesh.getAttribute('scale');
        initialScale = currentScaleObj.x;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && startX !== null && startY !== null) {
        const deltaX = e.touches[0].clientX - startX;
        const deltaY = e.touches[0].clientY - startY;

        currentRotY += deltaX * 0.5;
        currentRotX += deltaY * 0.5;

        houseMesh.setAttribute('rotation', `${currentRotX} ${currentRotY} 0`);

        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialDistance !== null) {
        const currentDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDistance / initialDistance;
        let newScale = Math.max(0.05, Math.min(1.5, initialScale * factor));
        houseMesh.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    });

    window.addEventListener('touchend', () => {
      startX = null;
      startY = null;
      initialDistance = null;
    });
  </script>
</body>
</html>
